org.gradle.jvmargs=-Xmx8g -Xms2g
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=true
org.gradle.workers.max=12
org.gradle.caching=true
org.gradle.vfs.watch=true

android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
# Required by Hilt (2.56.2) — still depends on the legacy BaseExtension. Drop when Hilt supports newDsl.
android.newDsl=false
# Required by KSP — still uses kotlin.sourceSets DSL. Drop when KSP supports built-in Kotlin.
android.builtInKotlin=false
